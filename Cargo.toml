[workspace]
resolver = "2"

members = [
    "crates/protocol",
    "crates/scheduler",
    "crates/runtime",
    "crates/workloads",
    "crates/server",
    "crates/worker",
]

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["derive"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"